    --shadow: 0 2px 10px rgba(0,0,0,.45);
    --gold-grad: linear-gradient(135deg,#F4D06F 0%,#D4AF37 45%,#A9791C 100%);
    --radius:16px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --bg:#0A0A0B; --surface:#151417; --ink:#F3EFE4; --muted:#B7AD99;
    }
  }
  :root[data-theme="dark"]{ --bg:#0A0A0B; --surface:#151417; --ink:#F3EFE4; --muted:#B7AD99; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:78px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* Topbar */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#141316 0%,#0A0A0B 100%);color:var(--ink);padding:14px 16px 16px;
    display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-2);}
  .brandwrap{display:flex;align-items:center;gap:10px;}
  .brandmark{width:38px;height:38px;border-radius:10px;flex:none;object-fit:contain;filter:drop-shadow(0 0 6px rgba(212,175,55,.35));}
  .brandtext .name{font-weight:800;font-size:16px;letter-spacing:.3px;line-height:1.1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brandtext .tag{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.4px;text-transform:uppercase;}
  .topbtn{background:var(--surface-2);border:1px solid var(--line-2);color:var(--brand-2);width:34px;height:34px;border-radius:10px;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .topbtn+.topbtn{margin-left:6px;}
  .topbtns{display:flex;}

  .screen{padding:16px;animation:fadein .22s ease-out;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .section-title{font-size:12px;font-weight:700;color:var(--brand-2);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 9px;display:flex;align-items:center;justify-content:space-between;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .15s;}

  /* Dashboard stat grid */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .stat{padding:14px;border-left:3px solid var(--brand);position:relative;overflow:hidden;}
  .stat .num{font-size:22px;font-weight:800;line-height:1.1;color:var(--ink);}
  .stat .lbl{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .stat.b-paid{border-color:var(--paid);} .stat.b-unpaid{border-color:var(--unpaid);}
  .stat.b-overdue{border-color:var(--overdue);} .stat.b-free{border-color:var(--free);}
  .stat.b-susp{border-color:var(--suspend);} .stat.b-money{border-color:var(--brand);}

  .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
  .quickbtn{padding:14px 6px;text-align:center;border:1px solid var(--line);transition:transform .12s,border-color .12s;}
  .quickbtn:active{transform:scale(.96);border-color:var(--brand);}
  .quickbtn .ic{font-size:20px;}
  .quickbtn .lb{font-size:11.5px;font-weight:600;margin-top:6px;color:var(--ink);}

  .alertbox{padding:12px 14px;border-radius:var(--radius);margin-top:10px;border:1px solid var(--line-2);}
  .alertbox.warn{background:var(--overdue-bg);}
  .alertbox.info{background:var(--unpaid-bg);}
  .alertbox .title{font-weight:700;font-size:13.5px;color:var(--ink);}
  .rowline{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);}
  .rowline:first-of-type{border-top:none;}
  .rowline .nm{font-weight:600;font-size:13.5px;}
  .rowline .sub{font-size:11.5px;color:var(--muted);}

  .waicon-btn{background:#1E6E43;color:#EAF9EF;border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;}

  /* Customer list */
  .searchbar{display:flex;gap:8px;}
  .searchbar input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;}
  .chip{flex:none;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);}
  .chip.active{background:var(--gold-grad);border-color:var(--brand);color:#1A1404;}
  .clist{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .citem{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .citem .left{min-width:0;}
  .citem .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .citem .mt{font-size:12px;color:var(--muted);margin-top:2px;}
  .citem .right{text-align:right;flex:none;}
  .bal{font-weight:700;font-size:13.5px;color:var(--brand-2);}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;margin-top:4px;letter-spacing:.3px;}
  .badge.Paid{background:var(--paid-bg);color:var(--paid);}
  .badge.Unpaid{background:var(--unpaid-bg);color:var(--unpaid);}
  .badge.Overdue{background:var(--overdue-bg);color:var(--overdue);}
  .badge.Free{background:var(--free-bg);color:var(--free);}
  .badge.Suspended{background:var(--suspend-bg);color:var(--suspend);}
  .badge.Disconnected{background:var(--disc-bg);color:var(--disc);}
  .badge.Sent{background:var(--paid-bg);color:var(--paid);}
  .badge.NotSent{background:var(--disc-bg);color:var(--disc);}
  .badge.Failed{background:var(--overdue-bg);color:var(--overdue);}
  .panel-btn{flex:none;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-size:15px;display:flex;align-items:center;justify-content:center;}
  .panel-btn:active{background:var(--brand);color:#0A0A0B;}
  .panel-btn.big{width:auto;height:auto;padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;gap:6px;}
  .empty{padding:40px 16px;text-align:center;color:var(--muted);}
  .empty .ic{font-size:30px;margin-bottom:8px;}

  /* Form */
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:14.5px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brand);}
  .field textarea{min-height:70px;resize:vertical;}
  .field .hint{font-size:11px;color:var(--faint);margin-top:4px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:14.5px;transition:transform .1s,opacity .1s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--gold-grad);color:#1A1404;box-shadow:0 2px 10px rgba(212,175,55,.25);}
  .btn-secondary{background:var(--surface-2);color:var(--brand-2);border:1.5px solid var(--brand-dark);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line-2);}
  .btn-danger{background:var(--overdue);color:#fff;}
  .btn-sm{padding:9px;font-size:13px;}
  .btn-row{display:flex;gap:8px;margin-top:14px;}
  .btn-row .btn{flex:1;}

  .segbtns{display:flex;gap:8px;flex-wrap:wrap;}
  .segbtn{padding:9px 13px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:700;}
  .segbtn.on-ACTIVE{border-color:var(--paid);color:var(--paid);}
  .segbtn.on-FREE{border-color:var(--free);color:var(--free);}
  .segbtn.on-SUSPENDED{border-color:var(--suspend);color:var(--suspend);}
  .segbtn.on-DISCONNECTED{border-color:var(--overdue);color:var(--overdue);}

  /* Detail */
  .profile-head{display:flex;align-items:center;gap:12px;padding:16px;}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--gold-grad);color:#1A1404;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;}
  .profile-head .nm{font-size:17px;font-weight:800;}
  .profile-head .mt{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .kv{padding:12px 16px;}
  .kvrow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .kvrow:first-child{border-top:none;}
  .kvrow .k{color:var(--muted);}
  .kvrow .v{font-weight:600;text-align:right;max-width:60%;}
  .actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px;}
  .histitem{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;}
  .histitem:first-child{border-top:none;}
  .histitem .tp{font-weight:700;}
  .histitem .tp.payment{color:var(--paid);}
  .histitem .tp.bill{color:var(--unpaid);}
  .histitem .dt{color:var(--faint);font-size:11.5px;}

  /* Bottom nav */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#0D0C0E;border-top:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;}
  .navbtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:10px;}
  .navbtn.active{color:var(--brand-2);}
  .navbtn .ic{font-size:19px;}
  .navbtn.center{background:var(--gold-grad);color:#1A1404;width:48px;height:48px;border-radius:50%;margin-top:-22px;justify-content:center;box-shadow:0 3px 14px rgba(212,175,55,.4);}
  .navbtn.center .ic{font-size:22px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{max-width:480px;width:100%;background:var(--surface);border:1px solid var(--line-2);border-bottom:none;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out;}
  @keyframes up{from{transform:translateY(16px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:36px;height:4px;background:var(--line-2);border-radius:2px;margin:0 auto 14px;}
  .sheet-title{font-size:16px;font-weight:800;margin-bottom:12px;}
  .walist{display:flex;flex-direction:column;gap:8px;}
  .waopt{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:12px;}
  .waopt .nm{font-weight:700;font-size:13.5px;}
  .waopt .ds{font-size:11.5px;color:var(--muted);}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;max-width:88%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.5);}

  .lockwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 20%,#1A1710 0%,#0A0A0B 70%);color:var(--ink);}
  .lockwrap .brandmark{width:96px;height:96px;margin-bottom:18px;filter:drop-shadow(0 0 16px rgba(212,175,55,.35));}
  .lockwrap h1{font-size:20px;margin:0 0 4px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .lockwrap p{opacity:.6;font-size:13px;margin:0 0 22px;color:var(--muted);}
  .pindots{display:flex;gap:12px;margin-bottom:22px;}
  .pindot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);}
  .pindot.filled{background:var(--gold-grad);border-color:var(--brand);}
  .keypad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
  .key{width:64px;height:64px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);font-size:20px;font-weight:700;}
  .key:active{background:var(--brand-dark);color:#fff;}

  .repitem{padding:14px;display:flex;align-items:center;justify-content:space-between;}
  .repitem .nm{font-weight:700;font-size:14px;}
  table.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
  table.rt th{text-align:left;color:var(--brand-2);font-size:11px;padding:6px 6px;border-bottom:1px solid var(--line-2);}
  table.rt td{padding:7px 6px;border-bottom:1px solid var(--line);}
  .scrollx{overflow-x:auto;}
  .toggler{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-top:1px solid var(--line);}
  .toggler:first-child{border-top:none;}
  .toggler .tn{font-size:13.5px;font-weight:600;}
  .toggler .td{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .switch{width:42px;height:24px;border-radius:14px;background:var(--line-2);position:relative;border:none;flex:none;}
  .switch.on{background:var(--gold-grad);}
  .switch .dot{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .15s;}
  .switch.on .dot{left:21px;}
  .banner-note{font-size:11.5px;color:var(--faint);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:9px 11px;margin-top:10px;line-height:1.5;}
  .checkrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);}
  .checkrow:first-child{border-top:none;}
  .checkrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--brand);flex:none;}
  .checkrow .nm{font-weight:700;font-size:13.5px;}
  .checkrow .mt{font-size:11.5px;color:var(--muted);}
  .pdflogo-wrap{display:flex;align-items:center;gap:10px;padding:10px 16px 0;}
  .pdflogo-wrap img{width:34px;height:34px;object-fit:contain;}
</style>
</head>

function loadDB(){

      d.settings.templates = Object.assign({}, defs.templates, d.settings.templates||{});
      d.settings.autoReminders = Object.assign({}, defs.autoReminders, d.settings.autoReminders||{});
      if(!d.settings.nextInvoiceNumber) d.settings.nextInvoiceNumber=defs.nextInvoiceNumber;
      if(!d.settings.nextCustomerNo) d.settings.nextCustomerNo=defs.nextCustomerNo;
      if(!d.settings.waApi) d.settings.waApi=defs.waApi;
      if(!d.customers) d.customers=[];
      d.customers.forEach(function(c){
        if(!c.customerNo){ c.customerNo=d.settings.nextCustomerNo; d.settings.nextCustomerNo++; }
        if(c.lastBill===undefined) c.lastBill=null;
      });
      return d;
    }
  }catch(e){}
  var seeded=seedCustomers();
  var s=defaultSettings(); s.nextCustomerNo=seeded.length+1;
  return {settings:s, customers:seeded};
}

/* ---------- utils ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function formatDate(iso){ if(!iso) return '-'; var d=new Date(iso+'T00:00:00'); var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear(); }
function money(n){ n=Number(n)||0; return DB.settings.currency+' '+n.toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function digitsOnly(s){ return String(s||'').replace(/\D/g,''); }
function initials(name){ var p=(name||'?').trim().split(/\s+/); return ((p[0]||'')[0]||'?').toUpperCase()+((p[1]||'')[0]||'').toUpperCase(); }
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2400);
}

  return true;
}
function isoFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDateFlexible(val){
  if(val===''||val==null) return null;
  if(val instanceof Date && !isNaN(val.getTime())) return isoFromDate(val);
  if(typeof val==='number'){ var d=new Date(Math.round((val-25569)*86400*1000)); if(!isNaN(d.getTime())) return isoFromDate(d); return null; }
  var s=String(val).trim();
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    var a=parseInt(m[1],10),b=parseInt(m[2],10),y=parseInt(m[3],10); if(y<100) y+=2000;
    var day,month;
    if(a>12){ day=a; month=b; } else if(b>12){ day=b; month=a; } else { day=a; month=b; }
    if(month<1||month>12) return null;
    return y+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  }
  var d2=new Date(s);
  if(!isNaN(d2.getTime())) return isoFromDate(d2);
  return null;
}
var HEADER_MAP={
  name:['customername','name','customer','clientname'],
  mobile:['phone','mobile','mobilenumber','phonenumber','contact','contactnumber','cellnumber'],
  whatsapp:['whatsapp','whatsappnumber','whatsappno','wanumber'],
  address:['address','location','area'],
  package:['package','plan','internetplan','packageplan','servicepackage'],
  monthlyBill:['monthlyfee','monthlybill','fee','bill','monthlyamount','amount','monthlycharges','charges'],
  billingDay:['billingdate','billingday','billday'],
  dueDate:['duedate','due','nextduedate','paymentduedate'],
  status:['status','customerstatus','connectionstatus','type','customertype'],
  pending:['pendingfee','outstandingfee','pendingbalance','outstandingbalance','balance','pendingamount','outstandingamount','previousbalance','duebalance'],
  notes:['notes','note','remarks','comment','comments']
};
function normalizeHeader(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
function mapRow(rawRow){
  var normKeys={};
  Object.keys(rawRow).forEach(function(k){ normKeys[normalizeHeader(k)]=rawRow[k]; });
  function pick(canon){
    var syns=HEADER_MAP[canon];
    for(var i=0;i<syns.length;i++){ if(normKeys.hasOwnProperty(syns[i]) && String(normKeys[syns[i]]).trim()!=='') return normKeys[syns[i]]; }
    return '';
  }
  return {
    name:String(pick('name')||'').trim(),
    mobile:String(pick('mobile')||'').trim(),
    whatsapp:String(pick('whatsapp')||'').trim(),
    address:String(pick('address')||'').trim(),
    package:String(pick('package')||'').trim(),
    monthlyBill:Number(pick('monthlyBill'))||0,
    billingDayRaw:pick('billingDay'),
    dueDateRaw:pick('dueDate'),
    statusRaw:String(pick('status')||'').trim().toLowerCase(),
    pending:Number(pick('pending'))||0,
    notes:String(pick('notes')||'').trim()
  };
}
function mapStatus(raw){
  if(raw.indexOf('free')>=0) return 'FREE';
  if(raw.indexOf('susp')>=0) return 'SUSPENDED';
  if(raw.indexOf('disc')>=0) return 'DISCONNECTED';
  return 'ACTIVE';
}
function customerKey(phoneOrWa, name){
  var d=digitsOnly(phoneOrWa);
  if(d && d.length>=7) return 'm:'+d;
  return 'n:'+String(name||'').trim().toLowerCase();
}
function buildExistingIndex(){
  var idx={};
  DB.customers.forEach(function(c){ idx[customerKey(c.whatsapp||c.mobile, c.name)]=c; });
  return idx;
}

/* ---------- domain logic ---------- */
function status(c){
  if(c.connectionStatus==='FREE') return 'Free';
  if(c.connectionStatus==='SUSPENDED') return 'Suspended';
  if(c.connectionStatus==='DISCONNECTED') return 'Disconnected';
  if(Number(c.balance)<=0) return 'Paid';
  if(todayISO() > c.dueDate) return 'Overdue';
  return 'Unpaid';
}
function statusLabel(st){ return st==='Unpaid' ? 'Pending' : st; }
function findCustomer(id){ return DB.customers.find(function(c){return c.id===id;}); }
function generateBill(c){
  c.balance = Number(c.balance||0) + Number(c.monthlyBill||0);
  c.dueDate = addDays(todayISO(), Number(DB.settings.graceDays||5));
  c.history.unshift({id:uid(),type:'bill',amount:c.monthlyBill,method:'-',note:'Monthly bill generated',date:todayISO()});
  c.lastBill = {generatedAt:todayISO(), invoiceNo:null, waStatus:'Not Sent', waAt:null};
  saveDB();
}
function recordPayment(c, amount, method, note, date){
  amount=Number(amount)||0;
  c.balance = Number(c.balance||0) - amount;
  c.history.unshift({id:uid(),type:'payment',amount:amount,method:method,note:note||'',date:date||todayISO()});
  saveDB();
}
function setConnectionStatus(c, newStatus){
  var prev=c.connectionStatus;
  c.connectionStatus=newStatus;
  if(newStatus==='FREE'){ c.monthlyBill=0; c.balance=0; }
  saveDB();
  return prev;
}

function fillTemplate(tpl, c, extra){
  extra=extra||{};
  return tpl
    .replace(/{name}/g, c.name||'')
    .replace(/{amount}/g, (extra.amount!=null? Number(extra.amount).toLocaleString('en-US') : Number(c.balance||0).toLocaleString('en-US')))
    .replace(/{due}/g, formatDate(c.dueDate))
    .replace(/{business}/g, DB.settings.businessName||'RANA-INTER-NET')
    .replace(/{currency}/g, DB.settings.currency||'Rs.')
    .replace(/{package}/g, c.package||'');
}

  }

function drawKV(doc,y,rows){
  doc.setFontSize(10.5);
  rows.forEach(function(r){
    if(r[2]==='divider'){ doc.setDrawColor(230,224,205); doc.line(14,y-4,196,y-4); return; }
    doc.setFont(undefined,'normal'); doc.setTextColor(100,95,80); doc.text(String(r[0]),14,y);
    doc.setFont(undefined,'bold'); doc.setTextColor(20,18,12); doc.text(String(r[1]),90,y);
    y+=8;
  });
  return y+4;
}
function drawTable(doc,y,headers,rows,widths){
  var startX=14, x=startX;
  doc.setFillColor(245,238,214); doc.rect(12,y-5,184,7,'F');
  doc.setFontSize(9); doc.setFont(undefined,'bold'); doc.setTextColor(120,95,20);
  headers.forEach(function(h,i){ doc.text(String(h), x, y); x+=widths[i]; });
  y+=6; doc.setDrawColor(212,175,55); doc.setLineWidth(.3);
  doc.setFont(undefined,'normal'); doc.setTextColor(20,18,12);
  rows.forEach(function(r,ri){
    if(y>282){ doc.addPage(); y=20; }
    if(ri%2===1){ doc.setFillColor(250,247,238); doc.rect(12,y-5,184,7,'F'); }
    x=startX;
    r.forEach(function(cell,i){ doc.text(String(cell), x, y, {maxWidth:widths[i]-2}); x+=widths[i]; });
    y+=8;
  });
  return y;
}
function footerNote(doc,y,text){
  var fy=Math.max(y+10,272);
  doc.setDrawColor(212,175,55); doc.setLineWidth(.3); doc.line(14,fy-6,196,fy-6);
  doc.setFontSize(8); doc.setTextColor(150,140,110);
  doc.text(text, 14, fy, {maxWidth:150});
  doc.setFontSize(7.5); doc.setTextColor(180,170,140);
  doc.text('Generated by '+(DB.settings.businessName||'RANA-INTER-NET')+' Billing System', 14, fy+6);
}
function jspdfReady(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('PDF tool did not load — check your internet connection and try again.'); return false; }
  return true;
}
async function offerPdf(doc, filename){
  var blob=doc.output('blob');
  try{
    if(window.claude && typeof window.claude.use==='function'){
      var downloads=await window.claude.use('downloads');
      if(downloads){
        await downloads.save({filename:filename, data:blob});
        toast('PDF ready to save.');
        return;
      }
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=filename; a.target='_blank'; a.rel='noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 400);
    toast('PDF opened — check your Downloads folder or new tab.');
  }catch(err){
    if(err && err.code==='declined'){ /* user cancelled, no message needed */ }
    else{ toast('Could not export PDF: '+((err&&err.message)||'unknown error')); }
  }
}
function buildBillPdf(c){
  var doc=new window.jspdf.jsPDF();
  var invNo=nextInvoiceNo();
  var prevPending=Math.max(0, Number(c.balance||0)-Number(c.monthlyBill||0));
  var y=pdfHeader(doc,'Internet Bill / Invoice',['Invoice: '+invNo,'Bill Date: '+formatDate(todayISO()),'Due Date: '+formatDate(c.dueDate)]);
  y=drawKV(doc,y,[
    ['Customer Name',c.name],['Customer ID',customerIdLabel(c)],
    ['Phone / WhatsApp',c.mobile||c.whatsapp||'-'],['Address',c.address||'-'],
    ['Package / Plan',c.package||'-'],['','','divider'],
    ['Previous Pending Balance',money(prevPending)],
    ['Current Month Charge',money(c.monthlyBill)],
    ['Total Payable',money(c.balance)],
    ['Payment Status',status(c)]
  ]);
  footerNote(doc,y,'Please pay on or before the due date to avoid service suspension. This is a system-generated invoice.');
  return {doc:doc, invNo:invNo, filename:'Bill_'+invNo+'_'+c.name.replace(/\s+/g,'_')+'.pdf'};
}
function markBillPrinted(c, invNo){
  if(!c.lastBill) c.lastBill={generatedAt:todayISO(),waStatus:'Not Sent',waAt:null};
  c.lastBill.invoiceNo=invNo;
  saveDB();
}
function markWaStatus(c, st){
  if(!c.lastBill) c.lastBill={generatedAt:todayISO(),invoiceNo:null,waStatus:'Not Sent',waAt:null};
  c.lastBill.waStatus=st; c.lastBill.waAt=new Date().toISOString();
  saveDB();
}
function pdfCustomerBill(c){
  if(!jspdfReady()) return;
  var r=buildBillPdf(c);
  offerPdf(r.doc, r.filename);
  markBillPrinted(c, r.invNo);
  return r.invNo;
}
async function shareBillPdf(c){
  if(!jspdfReady()) return;
  var r=buildBillPdf(c);
  var text=fillTemplate(DB.settings.templates.bill, c);
  try{
    var blob=r.doc.output('blob');
    var file=new File([blob], r.filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:r.filename, text:text});
      markWaStatus(c,'Shared');
      toast('Shared — pick WhatsApp and the customer\'s chat to send it.');
    } else {
      offerPdf(r.doc, r.filename);
      openWhatsApp(c, text+'\n\n(The PDF bill was downloaded separately — please attach it in WhatsApp manually.)');
      markWaStatus(c,'Manual');
      toast('This browser can\'t attach files to the share sheet — PDF downloaded and WhatsApp opened with the message; attach the PDF yourself.');
    }
  }catch(err){
    if(err && err.name==='AbortError'){ /* user closed the share sheet — not a failure */ }
    else { markWaStatus(c,'Failed'); toast('Could not share: '+((err&&err.message)||'unknown error')); }
  }
  markBillPrinted(c, r.invNo);
  render();
}

  if(billingToday.length){

/* ---------- Customers list ---------- */
function customerMatchesFilter(c, filter){
  var st=status(c);
  switch(filter){
    case 'All': return true;
    case 'Paid': return st==='Paid';
    case 'Unpaid': return st==='Unpaid';
    case 'Overdue': return st==='Overdue';
    case 'Free': return c.connectionStatus==='FREE';
    case 'Active': return c.connectionStatus==='ACTIVE';
    case 'Suspended': return c.connectionStatus==='SUSPENDED';
    case 'Disconnected': return c.connectionStatus==='DISCONNECTED';
    case 'DueToday': return c.connectionStatus==='ACTIVE' && c.dueDate===todayISO() && Number(c.balance)>0;
    case 'DueWeek': return c.connectionStatus==='ACTIVE' && Number(c.balance)>0 && c.dueDate>=todayISO() && c.dueDate<=addDays(todayISO(),7);
    default: return true;
  }
}
function filteredCustomers(){
  var q=(ui.search||'').trim().toLowerCase();
  return DB.customers.filter(function(c){
    if(!customerMatchesFilter(c,ui.filter)) return false;
    if(!q) return true;

  return '<div class="lockwrap">'+

  '</div>';
}
function wireLock(){
  document.querySelectorAll('.key').forEach(function(btn){
    btn.addEventListener('click', function(){
      var k=btn.dataset.key;
      if(k==='⌫'){ ui.pinBuffer=ui.pinBuffer.slice(0,-1); }
      else if(ui.pinBuffer.length<4){ ui.pinBuffer+=k; }
      if(ui.pinBuffer.length===4){
        if(ui.pinBuffer===DB.settings.pin){ ui.unlocked=true; ui.pinBuffer=''; render(); }
        else{ toast('Incorrect PIN'); ui.pinBuffer=''; render(); }
        return;
      }
      render();
    });
  });
}

function wireImport(){
  var input=document.getElementById('importFileInput');
  if(input){ input.addEventListener('change', function(e){ if(e.target.files[0]) handleImportFile(e.target.files[0]); }); }

function handleImportFile(file){
  if(!xlsxReady()) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=new Uint8Array(reader.result);
      var wb=window.XLSX.read(data,{type:'array',cellDates:true});
      var sheet=wb.Sheets[wb.SheetNames[0]];
      var raw=window.XLSX.utils.sheet_to_json(sheet,{defval:''});
      if(!raw.length){ toast('No rows found in this file.'); return; }
      var mapped=raw.map(mapRow);
      var withName=mapped.filter(function(r){return r.name;});
      var existingIndex=buildExistingIndex();
      withName.forEach(function(r){ r.__match=!!existingIndex[customerKey(r.whatsapp||r.mobile,r.name)]; });
      ui.importRows=withName;
      ui.importSkippedNoName=mapped.length-withName.length;
      ui.importFileName=file.name;
      render();
      toast('File read: '+withName.length+' customer row(s) found.');
    }catch(err){ toast('Could not read this file. Make sure it is a valid Excel or CSV file.'); }
  };
  reader.readAsArrayBuffer(file);
}
function runImport(mode){
  if(!ui.importRows || !ui.importRows.length){ return; }
  var existingIndex=buildExistingIndex();
  var counts={added:0,updated:0,skipped:0};
  ui.importRows.forEach(function(row){
    var conn=mapStatus(row.statusRaw);
    var due=parseDateFlexible(row.dueDateRaw) || addDays(todayISO(), DB.settings.graceDays||5);
    var bdNum=parseInt(row.billingDayRaw,10);
    var billingDay = (bdNum>=1 && bdNum<=31) ? bdNum : Number(due.slice(8,10))||1;
    var monthlyBill = conn==='FREE' ? 0 : (row.monthlyBill || DB.settings.defaultBill || 0);
    var pending = conn==='FREE' ? 0 : (row.pending || 0);
    var key=customerKey(row.whatsapp||row.mobile, row.name);
    var existing=existingIndex[key];
    if(existing){
      if(mode==='new'){ counts.skipped++; return; }
      existing.name=row.name||existing.name;
      if(row.mobile) existing.mobile=row.mobile;
      existing.whatsapp = row.whatsapp || existing.whatsapp || existing.mobile;
      if(row.address) existing.address=row.address;
      if(row.package) existing.package=row.package;
      existing.monthlyBill=monthlyBill;
      existing.billingDay=billingDay;
      existing.dueDate=due;
      existing.connectionStatus=conn;
      if(existing.balance!==pending){
        existing.history.unshift({id:uid(),type:'bill',amount:pending,method:'-',note:'Balance updated via spreadsheet sync',date:todayISO()});
      }
      existing.balance=pending;
      if(row.notes) existing.notes=row.notes;
      counts.updated++;
    } else {
      var nc={id:uid(),customerNo:nextCustomerNo(),name:row.name,mobile:row.mobile,whatsapp:row.whatsapp||row.mobile,address:row.address,package:row.package,
        monthlyBill:monthlyBill,billingDay:billingDay,dueDate:due,balance:pending,connectionStatus:conn,notes:row.notes,history:[],createdAt:todayISO(),lastBill:null};
      if(pending>0) nc.history.unshift({id:uid(),type:'bill',amount:pending,method:'-',note:'Opening balance from spreadsheet import',date:todayISO()});
      DB.customers.unshift(nc);
      existingIndex[key]=nc;
      counts.added++;
    }
  });
  saveDB();
  ui.importRows=null; ui.importFileName=null; ui.importSkippedNoName=0;
  nav('customers');
  toast('Import done — '+counts.added+' added, '+counts.updated+' updated, '+counts.skipped+' skipped.');
}
async function downloadTemplate(){
  var csv='Customer Name,Mobile Number,WhatsApp Number,Address,Package,Monthly Fee,Billing Day,Due Date,Status,Pending Fee,Notes\n'+
    'Ahmed Raza,03001234567,923001234567,Street 4 Model Town,10 Mbps Home,1500,5,2026-09-25,Active,1500,Example row - delete before import\n';
  try{
    if(window.claude && typeof window.claude.use==='function'){
      var downloads=await window.claude.use('downloads');
      if(downloads){ await downloads.save({filename:'RANA-INTER-NET_Import_Template.csv', data:csv}); toast('Template ready to save.'); return; }
    }
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download='RANA-INTER-NET_Import_Template.csv'; a.target='_blank'; a.rel='noopener noreferrer';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 400);
  }catch(err){ if(!(err&&err.code==='declined')) toast('Could not download template.'); }
}

function handleAction(action,id,extra,el){
  switch(action){
    case 'nav': nav(id); break;
    case 'back': nav(route.screen==='detail'?'customers':(route.screen==='form'?(route.id?'detail':'customers'):'dashboard'), route.screen==='form'&&route.id?route.id:null); break;
    case 'goCustomers': nav('customers'); break;
    case 'goReports': nav('reports'); break;
    case 'goImport': nav('import'); break;
    case 'downloadTemplate': downloadTemplate(); break;
    case 'runImport': runImport(id); break;
    case 'clearImport': ui.importRows=null; ui.importFileName=null; ui.importSkippedNoName=0; render(); break;
    case 'lockNow': ui.unlocked=false; ui.pinBuffer=''; render(); break;
    case 'quickAdd': nav('form'); break;
    case 'openCustomer': nav('detail', id); break;
    case 'editCustomer': nav('form', id); break;
    case 'cancelEdit': nav('detail', id); break;
    case 'setFilter': ui.filter=id; renderCustomersOnly(); break;
    case 'setStatus': doSetStatus(id, extra); break;
    case 'openPayment': openModal(modalPayment(findCustomer(id))); break;
    case 'quickPayment': openModal(modalPickCustomer('payment')); window.__pickPurpose='payment'; break;
    case 'quickWA': openModal(modalPickCustomer('wa')); window.__pickPurpose='wa'; break;
    case 'pickCustomer':
      closeModalEl();
      if(extra==='payment') openModal(modalPayment(findCustomer(id)));
      else if(extra==='wa') openModal(modalWaMenu(findCustomer(id)));
      break;
    case 'savePayment': doSavePayment(id); break;
    case 'generateBillNow': doGenerateBill(id); break;
    case 'bulkBill': doBulkBill(); break;
    case 'openWaMenu': openModal(modalWaMenu(findCustomer(id))); break;
    case 'openPanel': openCustomerPanel(findCustomer(id)); break;
    case 'editPanelLink': openModal(modalEditPanel(findCustomer(id))); break;
    case 'savePanelLink': doSavePanelLink(id); break;
    case 'sendWaTpl': doSendWaTpl(id, extra); break;
    case 'sendCustom': doSendCustom(id); break;
    case 'saveCustomer': doSaveCustomer(id); break;
    case 'deleteCustomer':
      if(!el.dataset.confirmed) openModal(modalConfirm('Delete this customer and all their payment history? This cannot be undone.','deleteCustomer', id));
      else { DB.customers=DB.customers.filter(function(c){return c.id!==id;}); saveDB(); closeModalEl(); nav('customers'); toast('Customer deleted.'); }
      break;
    case 'exportBillPdf': pdfCustomerBill(findCustomer(id)); render(); break;
    case 'viewBillPdf': pdfCustomerBill(findCustomer(id)); render(); break;
    case 'sendBillWa': shareBillPdf(findCustomer(id)); break;
    case 'exportHistoryPdf': pdfCustomerHistory(findCustomer(id)); break;
    case 'receiptPdf': { var c=findCustomer(id); var h=c.history.find(function(x){return x.id===extra;}); if(h) pdfReceipt(c,h); break; }
    case 'viewReport': ui.reportKey=(ui.reportKey===id?null:id); render(); break;
    case 'exportReport': { var def=REPORTS.find(function(r){return r.key===id;}); var data=def.build(); pdfGeneric(def.label, data.headers, data.rows, data.widths); break; }
    case 'saveSettings': doSaveSettings(); break;
    case 'saveWaApi': doSaveWaApi(); break;
    case 'savePin': doSavePin(); break;
    case 'saveTemplates': doSaveTemplates(); break;
    case 'toggleReminder': DB.settings.autoReminders[id]=!DB.settings.autoReminders[id]; saveDB(); render(); break;
    case 'exportBackup': doExportBackup(); break;
    case 'importBackup': doImportBackup(); break;
    case 'goBulkSend': ui.bulkSelected={}; ui.bulkQueue=null; nav('bulksend'); break;
    case 'toggleBulkSelect': ui.bulkSelected[id]=!ui.bulkSelected[id]; renderBulkSendOnly(); break;
    case 'bulkSelectAll': filterBulkCandidates().forEach(function(c){ ui.bulkSelected[c.id]=true; }); renderBulkSendOnly(); break;
    case 'bulkGenerateSelected': doBulkGenerateSelected(); break;
    case 'startBulkQueue': startBulkQueue(); break;
    case 'sendNextBulk': sendNextInQueue(); break;

    case 'wipeAll':
      if(!el.dataset.confirmed) openModal(modalConfirm('Erase ALL customers, payments and settings from this device? Export a backup first if you need one.','wipeAll',null));
      else { localStorage.removeItem(STORAGE_KEY); DB=loadDB(); closeModalEl(); nav('dashboard'); toast('All data erased.'); }
      break;
    case 'closeModal': closeModalEl(); break;
  }

    package:document.getElementById('f_package').value.trim(),
    monthlyBill:Number(document.getElementById('f_bill').value)||0,
    billingDay:Math.min(31,Math.max(1,Number(document.getElementById('f_billingday').value)||1)),
    dueDate:document.getElementById('f_duedate').value||addDays(todayISO(),DB.settings.graceDays||5),
    connectionStatus:status_,
    panelUrl:document.getElementById('f_panelurl').value.trim(),
    panelUsername:document.getElementById('f_panelusername').value.trim(),
    notes:document.getElementById('f_notes').value
  };
  if(status_==='FREE'){ data.monthlyBill=0; }
  if(!data.whatsapp) data.whatsapp=data.mobile;
  var c=id?findCustomer(id):null;
  if(c){
    Object.assign(c, data);
    var balEl=document.getElementById('f_balance');
    if(balEl) c.balance=Number(balEl.value)||0;
    if(status_==='FREE') c.balance=0;
    saveDB(); nav('detail', c.id); toast('Customer updated.');
  } else {
    var nc=Object.assign({id:uid(),customerNo:nextCustomerNo(),balance:status_==='FREE'?0:data.monthlyBill,history:[],createdAt:todayISO(),lastBill:null}, data);
    DB.customers.unshift(nc); saveDB(); nav('detail', nc.id); toast('Customer added.');
  }
}
function doSaveSettings(){
  var s=DB.settings;
  s.businessName=document.getElementById('s_name').value.trim()||'RANA-INTER-NET';
  s.ownerPhone=document.getElementById('s_phone').value.trim();
  s.whatsapp=document.getElementById('s_wa').value.trim();
  s.address=document.getElementById('s_address').value.trim();
  s.currency=document.getElementById('s_currency').value.trim()||'Rs.';
  s.defaultBill=Number(document.getElementById('s_defbill').value)||0;
  s.graceDays=Number(document.getElementById('s_grace').value)||5;
  saveDB(); toast('Business info saved.'); render();
}
function doSaveWaApi(){
  DB.settings.waApi={
    phoneNumberId: document.getElementById('api_phoneid').value.trim(),
    accessToken: document.getElementById('api_token').value.trim(),
    businessAccountId: document.getElementById('api_bizid').value.trim()
  };
  saveDB(); toast('API details saved for your records. Automatic sending still needs a connected backend (see note above).'); render();
}
function doSavePin(){
  var pin=document.getElementById('s_pin').value.trim();
  if(pin && !/^\d{4}$/.test(pin)){ toast('PIN must be exactly 4 digits.'); return; }
  DB.settings.pin=pin; saveDB(); toast(pin?'PIN set.':'PIN removed.'); render();
}
function doSaveTemplates(){
  var t=DB.settings.templates;
  t.bill=document.getElementById('t_bill').value;
  t.payment=document.getElementById('t_payment').value;
  t.reminder=document.getElementById('t_reminder').value;
  t.overdue=document.getElementById('t_overdue').value;
  t.pendingDue=document.getElementById('t_pendingDue').value;
  t.suspend=document.getElementById('t_suspend').value;
  t.reconnect=document.getElementById('t_reconnect').value;
  saveDB(); toast('Templates saved.');
}
async function doExportBackup(){
  var json=JSON.stringify(DB, null, 2);
  var filename='RANA-INTER-NET_Backup_'+todayISO()+'.json';
  try{
    if(window.claude && typeof window.claude.use==='function'){
      var downloads=await window.claude.use('downloads');
      if(downloads){ await downloads.save({filename:filename, data:json}); toast('Backup ready to save.'); return; }
    }
    var blob=new Blob([json],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename; a.target='_blank'; a.rel='noopener noreferrer';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 400);
    toast('Backup file opened — check your Downloads folder.');
  }catch(err){
    if(!(err && err.code==='declined')) toast('Could not export backup: '+((err&&err.message)||'unknown error'));
  }
}
function doImportBackup(){
  var f=document.getElementById('importFile').files[0];
  if(!f){ toast('Choose a backup file first.'); return; }
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!data.customers || !data.settings) throw new Error('bad format');
      DB=data; saveDB(); toast('Backup restored.'); nav('dashboard');
    }catch(e){ toast('Invalid backup file.'); }
  };
  reader.readAsText(f);
}

/* ---------- init ---------- */
render();
})();
</script>
</body>
</html>
